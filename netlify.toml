[build]
  command = "npm run build"
  publish = "dist"
[functions]
  directory = "cms-functions"
  node_bundler = "esbuild"
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
[[redirects]]
  from = "/admin/"
  to = "/admin.html"
  status = 200
[[headers]]
  for = "/admin*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
